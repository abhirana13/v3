[project]
name = "analytics-dash-backend"
version = "0.1.0"
description = "Self-hosted SQL to chart analytics backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "redshift-connector>=2.1",
  "duckdb>=1.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "apscheduler>=3.10",
  "sshtunnel>=0.4.0",
  # sshtunnel 0.4.0 references paramiko.DSSKey, which paramiko removed in 4.0.
  # Without this cap the (lockfile-less) build resolves paramiko 5.x and every
  # bastion Redshift connection dies with "module 'paramiko' has no attribute
  # 'DSSKey'". 3.5.1 is the newest release that still ships DSSKey.
  "paramiko>=3.4,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
