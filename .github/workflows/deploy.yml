name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Configure AWS credentials
        # v6, not v4 and not v5: BOTH v4 and v5 declare runs.using = node20, which GitHub now
        # force-runs on Node 24
        # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
        # v6 is the first major that declares node24. Same aws-access-key-id /
        # aws-secret-access-key / aws-region inputs, so it is a drop-in.
        # NOTE: this only silences the deprecation warning — it is NOT what was failing the
        # deploy. "Process completed with exit code 1" came from the Deploy via SSM step,
        # which means this step had already succeeded.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-id i-09bbb87968beb953a \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -e",
              "export HOME=/root",
              "git config --global --add safe.directory /opt/tools/analytics-dashboard",
              "cd /opt/tools/analytics-dashboard",
              "git pull origin main",
              "mkdir -p /usr/local/lib/docker/cli-plugins",
              "if [ ! -x /usr/local/lib/docker/cli-plugins/docker-buildx ]; then curl -fsSL https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64 -o /usr/local/lib/docker/cli-plugins/docker-buildx && chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx; fi",
              "echo ===== disk before =====; df -h /; docker system df || true",
              "docker image prune -af || true",
              "if [ $(df --output=pcent / | tr -dc 0-9) -gt 80 ]; then echo Disk still above 80 pct, dropping the build cache; docker builder prune -af || true; fi",
              "echo ===== disk after prune =====; df -h /",
              "docker compose -f docker-compose.prod.yml up --build -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-09bbb87968beb953a \
              --query "Status" \
              --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then break; fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              # BOTH streams. Printing only stderr hid the cause of real failures: a
              # `git pull` refusing to overwrite local changes, an OOM-killed `npm run
              # build` (exit 137) and a full disk all write the useful part to stdout,
              # so the job failed with an empty error block and nothing to go on.
              echo "::group::StandardOutputContent"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-09bbb87968beb953a \
                --query "StandardOutputContent" \
                --output text
              echo "::endgroup::"
              echo "::group::StandardErrorContent"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-09bbb87968beb953a \
                --query "StandardErrorContent" \
                --output text
              echo "::endgroup::"
              exit 1
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-09bbb87968beb953a \
            --query "StandardOutputContent" \
            --output text
